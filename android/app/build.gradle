plugins { id 'com.android.application' }

def siteHost = project.findProperty('siteHost') ?: 'example.github.io'
def sitePath = project.findProperty('sitePath') ?: '/'
def vCode    = (project.findProperty('versionCode') ?: '1').toInteger()

android {
    namespace 'app.cloudnest.twa'
    compileSdk 34

    defaultConfig {
        applicationId 'app.cloudnest.twa'
        minSdk 23
        targetSdk 34
        versionCode vCode
        versionName "1.${vCode}"
        manifestPlaceholders = [
            hostName : siteHost,
            launchUrl: "https://${siteHost}${sitePath}",
            pathPrefix: sitePath
        ]
    }
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
